# pattern-tool 网关（生产：HTTP 跳 HTTPS + SSL 反代）
# 使用前全局替换域名：sed -i 's/pattern\.example\.com/你的域名/g' 本文件
# 证书位置 = 宿主机 certbot 签发目录（compose 只读挂载 /etc/letsencrypt）

# ---- 80：ACME 验证保留 + 全站跳 HTTPS ----
server {
    listen 80;
    server_name www.apidev-app.com;

    # certbot webroot 续期路径（standalone 续期用不到，保留兼容零停机续法）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：SSL 反代 app:8200 ----
server {
    listen 443 ssl;
    http2 on;
    server_name www.apidev-app.com;

    ssl_certificate     /etc/letsencrypt/live/www.apidev-app.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.apidev-app.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 上传上限：单批最多 9 图 × 15MB（images）+ 最多 9 张 originals × 15MB
    # + multipart 开销 → 300m（技术方案 6 节上传校验的后端兜底之外的前置放行）
    client_max_body_size 300m;

    # 慢链路上传 9×15MB 与轮询长连接的超时预算
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    location / {
        # pt-web = compose 服务名（容器网络 DNS），技术方案 2 节对该单体的正式命名
        proxy_pass http://pt-web:8200;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 应用限流取 X-Forwarded-For 首段（src/app/api.py get_client_ip）
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
