<!DOCTYPE html>
<!-- pattern-tool 前端单页：原生 HTML/CSS/JS，无构建链（技术方案 7.1 前端选型）
     主路径 = 上传 → 提交 → 拿图；裁剪为逐图可选增强，默认收起（1.2 节） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>糯米纸图案自动化修图工具</title>
  <link rel="stylesheet" href="vendor/cropper.min.css">
  <style>
    /* ---- 基础布局：桌面 Web 端（2026-08-27 修订——只作桌面用，760px 移动优先撤销） ---- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8; color: #222; line-height: 1.6;
      max-width: 1100px; margin: 0 auto; padding: 16px 16px 96px;
    }
    header { text-align: center; padding: 12px 0 4px; }
    header h1 { font-size: 22px; }
    header p { font-size: 13px; color: #888; }

    section { background: #fff; border-radius: 12px; padding: 16px; margin-top: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    section h2 { font-size: 16px; margin-bottom: 10px; }

    /* ---- 双栏同屏主区（2026-08-27 第六次修订：左上传/右结果同屏共存，
       上传→提交→看结果不再纵向滚动；窄屏（<960px）退回单栏） ----
       2026-08-27 对齐修正：等宽 1fr/1fr + stretch 等高（用户实测右宽左窄不齐）；
       右栏结果卡横排图需要更宽画布，左栏上传列表自动撑满同行 */
    #main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: stretch; margin-top: 14px; }
    #main-grid > section { margin-top: 0; display: flex; flex-direction: column; }
    #main-grid > section > h2 { flex: 0 0 auto; }
    #upload-list { flex: 1 1 auto; }
    /* 底部按钮行对齐（2026-08-27：结果列表同样 flex 占满，"再处理一批"与
       "开始处理"都贴各自卡片底边——stretch 等高下两按钮同一水平线） */
    #result-list { flex: 1 1 auto; }
    #submit-row button, #restart-row button { font-size: 15px; padding: 10px 32px; }
    @media (max-width: 960px) { #main-grid { grid-template-columns: 1fr; } }

    /* 统一尺寸批量行（2026-08-27 第七次修订；同日位置修订：与标题同行右对齐，
       独立行撤销——用户标注期望位置 + hint 提示行已删） */
    .batch-size-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #upload-panel .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    #upload-panel .panel-head h2 { margin-bottom: 0; }

    /* 自绘下拉（2026-08-27 定稿：浮层模式——绝对定位悬浮于选择器下方，
       不顶开任何元素；用户实测"推开内容"版不满意，改回浮层但保留自绘
       外观与滑出动画。原生 select 弃用原因：选项样式/定位不可控） */
    .size-dropdown { min-width: 190px; position: relative; }
    .size-dropdown-trigger {
      width: 100%; text-align: left; background: #fff; border: 1px solid #e5e7eb;
      border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #555;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .size-dropdown-trigger::after { content: '▾'; color: #999; font-size: 10px; transition: transform .2s; }
    .size-dropdown.open .size-dropdown-trigger::after { transform: rotate(180deg); }
    .size-dropdown-menu {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
      width: 100%; /* 与触发按钮同宽（菜单宽度跟选择器，不再按内容自适应） */
      max-height: 0; overflow: hidden; transition: max-height .25s ease;
    }
    .size-dropdown.open .size-dropdown-menu { max-height: 420px; }
    .size-dropdown-menu-inner {
      border: 1px solid #e5e7eb; border-radius: 6px; background: #fff;
      padding: 4px 0; box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }
    .size-dropdown-menu-inner .menu-option {
      padding: 5px 12px; font-size: 13px; color: #333; cursor: pointer; white-space: nowrap;
    }
    .size-dropdown-menu-inner .menu-option:hover { background: #f0f6ff; color: #2563eb; }
    .size-dropdown-menu-inner .menu-option.selected { color: #2563eb; font-weight: 600; }

    /* ---- 上传区（桌面：收窄虚线框，左右空间留给已选缩略图） ---- */
    #upload-drop-zone {
      border: 2px dashed #c8ccd4; border-radius: 12px; padding: 26px 12px;
      text-align: center; color: #888; cursor: pointer; transition: border-color .2s;
    }
    #upload-drop-zone.dragover { border-color: #3b82f6; background: #f0f6ff; }
    #upload-drop-zone .main-hint { font-size: 15px; color: #333; }
    #upload-drop-zone .sub-hint { font-size: 12px; margin-top: 4px; }

    /* ---- 图片列表（2026-08-27 用户定案：左右两栏同构 3×3 网格——
         结果横排大卡撤销，查看细节走 hover 放大浮层） ---- */
    .image-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
    #result-list.image-list { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .image-card {
      border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; background: #fafafa;
      display: flex; flex-direction: column; position: relative;
    }
    /* 结果卡横排大卡布局已撤（2026-08-27 用户定案 3×3 同构网格）；
       卡内结构与上传卡一致：竖排缩略图 + 信息 + 动作 */
    /* 悬停放大角标（可发现性：hover 浮层此前无任何入口提示） */
    .thumb-wrap .zoom-hint {
      position: absolute; bottom: 6px; right: 6px; z-index: 2;
      background: rgba(0,0,0,.55); color: #fff; border-radius: 4px;
      font-size: 11px; padding: 1px 6px; pointer-events: none; opacity: 0; transition: opacity .15s;
    }
    .thumb-wrap.zoomable:hover .zoom-hint { opacity: 1; }
    .image-card .thumb-wrap { position: relative; width: 100%; aspect-ratio: 1; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/16px 16px; }
    .image-card img.thumb { width: 100%; height: 100%; object-fit: contain; }
    .image-card .card-info { padding: 8px; font-size: 12px; }
    .image-card .seq-badge {
      position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.55); color: #fff;
      border-radius: 999px; font-size: 11px; padding: 1px 8px; z-index: 2;
    }
    .image-card .card-actions { display: flex; gap: 6px; padding: 0 8px 8px; flex-wrap: wrap; }
    /* 步骤状态垂直排列（2026-08-26 21:54 需求：按执行顺序逐行显示） */
    .image-card .stage-tags { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-top: 2px; }
    .tag { font-size: 11px; border-radius: 4px; padding: 0 6px; line-height: 20px; background: #eef1f5; color: #555; }
    .tag.done { background: #e6f7ec; color: #1a7f37; }
    .tag.skipped { background: #f1f2f4; color: #999; }
    .tag.fallback { background: #fff4e5; color: #b25e09; }
    .tag.hint-low-res, .tag.hint-heavy-watermark { background: #fdeaea; color: #c0392b; }
    /* 步骤执行失败（2026-08-27：超分降级等——红底红字，一眼可辨） */
    .tag.failed { background: #fdeaea; color: #c0392b; font-weight: 600; }

    .status-text { font-size: 12px; color: #666; }
    .status-text.processing { color: #2563eb; }
    .status-text.completed { color: #1a7f37; }
    .status-text.failed { color: #c0392b; }
    /* 处理耗时计时（2026-08-27）：等宽数字防跳动，弱化色不抢状态主色 */
    .elapsed-timer { font-variant-numeric: tabular-nums; color: #9aa4b2; margin-left: 4px; }

    /* ---- 按钮 ---- */
    button {
      border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
      padding: 6px 12px; background: #eef1f5; color: #333;
    }
    button.primary { background: #2563eb; color: #fff; font-size: 15px; padding: 10px 32px; width: auto; min-width: 180px; }
    button.primary:disabled { background: #9db8e0; cursor: not-allowed; }
    /* 提交行：定宽按钮右对齐（桌面规范——原全宽拇指按钮是移动规范） */
    #submit-row { margin-top: 14px; display: flex; justify-content: flex-end; }
    button.danger { color: #c0392b; }
    button.ghost { background: #fff; border: 1px solid #d7dbe2; }

    /* ---- 裁剪弹层 ---- */
    #crop-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100;
      display: none; flex-direction: column; padding: 12px;
    }
    #crop-modal.active { display: flex; }
    #crop-modal .crop-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: #fff; font-size: 14px; }
    #crop-modal .crop-head select, #crop-modal .crop-head input[type=range] { flex: 0 1 auto; }
    #crop-modal select { padding: 4px 8px; border-radius: 6px; border: none; font-size: 13px; }
    .size-row { margin-top: 4px; }
    .size-select { padding: 4px 8px; border-radius: 6px; border: 1px solid #e5e7eb; font-size: 12px; background: #fff; color: #555; max-width: 100%; }
    #crop-stage { flex: 1; min-height: 0; margin-top: 10px; }
    #crop-stage img { display: block; max-width: 100%; }
    #crop-modal .crop-foot { display: flex; gap: 10px; margin-top: 10px; }
    #crop-modal .crop-foot button { flex: 1; padding: 10px 0; font-size: 15px; }

    /* 形状遮罩预览（叠在 cropper 裁剪框上；不拦截指针，拖拽交互仍走 cropper 手柄） */
    .shape-overlay-canvas {
      position: absolute; inset: 0; z-index: 2;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* 形状模式：隐藏矩形裁剪框全部附件（边框/手柄/虚线/中线），只留形状遮罩。
       矩形框只是 cropperjs 的载体，有效区域是内切形状——附件误导用户以为框角可选 */
    .cropper-crop-box.shape-mode .cropper-view-box { outline: none !important; }
    .cropper-crop-box.shape-mode .cropper-dashed,
    .cropper-crop-box.shape-mode .cropper-center,
    .cropper-crop-box.shape-mode .cropper-line,
    .cropper-crop-box.shape-mode .cropper-point { display: none !important; }
    /* 缩放锚点：右下角一个可见手柄（形状模式下唯一的尺寸调节入口） */
    .cropper-crop-box.shape-mode .cropper-point.point-se {
      display: block !important;
      width: 10px; height: 10px; opacity: .7;
    }

    /* ---- 结果删除（2026-08-27 终版：勾选框已撤——标题行"全部删除"+确认弹窗；
       卡片内保留单张删除钮；前端会话级，文件仍由后端 24h TTL 清理） ---- */

    /* 结果区标题行右侧页面级按钮（2026-08-27 用户定案：下载/删除两个按钮
       放"2. 处理结果"标题行右侧——与左栏"统一尺寸"标题行同构；卡片上
       不再有按钮） */
    #result-panel .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    #result-panel .panel-head h2 { margin-bottom: 0; }
    #result-panel .panel-head .head-actions { display: flex; gap: 8px; align-items: center; }
    #result-panel .panel-head .head-actions .danger-ghost { color: #c0392b; background: #fff; border: 1px solid #f0c8c8; }

    /* ---- 顶部小弹窗 toast（2026-08-27：按钮反馈统一入口——下载/删除/复制
       的结果提示不再原地改文字，顶部滑入自动消失） ---- */
    #toast-layer {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center;
      pointer-events: none;
    }
    .toast-item {
      background: rgba(20, 24, 32, .88); color: #fff; font-size: 13px;
      border-radius: 8px; padding: 8px 18px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
      opacity: 0; transform: translateY(-8px); transition: all .25s ease;
    }
    .toast-item.show { opacity: 1; transform: translateY(0); }
    .toast-item.toast-error { background: rgba(160, 30, 30, .92); }

    /* ---- 结果动作条 ---- */
    .result-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

    /* ---- 结果图悬停放大浮层（桌面 hover 查看细节；触屏无 hover 不触发） ---- */
    #result-zoom-layer {
      position: fixed; z-index: 200; display: none;
      pointer-events: none; /* 浮层不吃事件，鼠标操作不被打断 */
      border: 1px solid #d7dbe2; border-radius: 8px; overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
      /* 棋盘格底（2026-08-26 15:14 修复）：形状外透明区的真实显示——
         纯白底会把 transparent 像素衬成"白"，误读为未透明 */
      background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/16px 16px;
    }
    #result-zoom-layer.active { display: block; }
    #result-zoom-layer img { display: block; max-width: none; max-height: none; }
    .image-card .thumb-wrap.zoomable { cursor: zoom-in; }
    /* 上传卡片 hover 反馈（2026-08-27：鼠标扫过有轻微抬升，列表可交互感） */
    .image-card:hover { border-color: #b8c2d0; }
    .result-actions a.download-link {
      text-decoration: none; background: #2563eb; color: #fff; border-radius: 8px;
      padding: 6px 12px; font-size: 13px; display: inline-block;
    }

    /* ---- 免责声明（页脚常驻，7 章合规红线；2026-08-27 对齐修正：
       与双栏卡片同宽左右对齐——原限宽 600px 居中在双栏下显得脱节） ---- */
    footer { margin-top: 20px; font-size: 12px; color: #999; text-align: center; }
    footer .disclaimer { text-align: left; background: #fff; border-radius: 10px; padding: 10px 12px; }
    footer .disclaimer .ttl-hint { display: block; margin-top: 4px; color: #b0b0b0; }

    .mobile-hint { display: none; font-size: 12px; color: #2563eb; margin-top: 4px; }
    @media (pointer: coarse) { .mobile-hint { display: block; } .desktop-only { display: none; } }
  </style>
</head>
<body>
  <header>
    <h1>糯米纸图案自动化修图工具</h1>
    <p>上传 → 自动去水印 / 填充 / 裁剪 / 变清晰 / 描边 → 下载保存成品</p>
  </header>

  <!-- 双栏主区：左上传（常驻）/ 右结果（常驻，未提交时引导文案） -->
  <div id="main-grid">
    <!-- 左栏：上传面板 -->
    <section id="upload-panel">
      <div class="panel-head">
        <h2>1. 选择图片（1–9 张）</h2>
        <!-- 统一尺寸批量（2026-08-27 自绘下拉：选项从选择器下方滑出推开内容，
             不再浮层遮挡）：选中即应用到全部待处理图 -->
        <div class="batch-size-row">
          <span style="font-size:13px;color:#555;">统一尺寸：</span>
          <div class="size-dropdown" id="batch-size-dropdown">
            <button type="button" class="size-dropdown-trigger" id="batch-size-trigger">不设置</button>
            <div class="size-dropdown-menu"><div class="size-dropdown-menu-inner" id="batch-size-menu"></div></div>
          </div>
        </div>
      </div>
      <div id="upload-drop-zone">
        <div class="main-hint">点击选择 / 拖拽 / Ctrl+V 粘贴图片</div>
        <div class="sub-hint" id="upload-limits-hint">支持 PNG / JPG / WebP</div>
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" multiple hidden>
      </div>
      <div class="image-list" id="upload-list"></div>
      <div id="submit-row">
        <button class="primary" id="submit-button" disabled>开始处理</button>
      </div>
    </section>

    <!-- 右栏：结果面板（双栏常驻——原 display:none 收起改引导文案占位） -->
    <section id="result-panel">
      <div class="panel-head">
        <h2>2. 处理结果</h2>
        <!-- 页面级动作（2026-08-27 用户定案：标题行右侧"下载/删除"两钮——
             下载=当前结果打包 ZIP，删除=删除勾选；有结果才可用） -->
        <div class="head-actions" id="result-head-actions">
          <button id="batch-download-button" disabled>批量下载</button>
          <button id="batch-delete-button" class="danger-ghost" disabled>批量删除</button>
        </div>
      </div>
      <!-- 过程反馈条（打包进度等瞬时提示；常驻引导文案已撤） -->
      <div id="batch-actions" style="display: none; margin-bottom: 10px; gap: 8px;">
        <span id="batch-status" style="font-size: 12px; color: #888; line-height: 34px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
      </div>
      <div class="image-list" id="result-list"></div>
      <div id="restart-row" style="margin-top: 14px; display:flex; gap:10px;">
        <button class="ghost" id="restart-button" style="flex:1;">再处理一批</button>
      </div>
    </section>
  </div>

  <!-- 裁剪弹层（逐图可选，默认收起） -->
  <div id="crop-modal">
    <div class="crop-head">
      <span>形状：</span>
      <select id="crop-shape-select">
        <option value="rectangle" selected>自由矩形</option>
        <option value="circle">圆形</option>
        <option value="square">正方形</option>
        <option value="rectangle-fixed">长方形</option>
        <option value="heart">爱心</option>
        <option value="star">星形</option>
      </select>
      <span id="crop-size-label" style="margin-left:auto; font-size:12px;"></span>
    </div>
    <div id="crop-stage"><img id="crop-source-image" alt="裁剪原图"></div>
    <div class="crop-foot">
      <button id="crop-cancel-button" class="ghost">取消</button>
      <button id="crop-apply-button" style="background:#2563eb;color:#fff;">完成裁剪</button>
    </div>
  </div>

  <!-- 结果图悬停放大浮层（跟随鼠标，桌面专用；触屏无 hover 自动不触发） -->
  <div id="result-zoom-layer"><img alt="放大查看"></div>

  <!-- 顶部小弹窗（按钮反馈：下载/删除/复制结果提示） -->
  <div id="toast-layer"></div>

  <footer>
    <div class="disclaimer" id="disclaimer-text">免责声明加载中…</div>
  </footer>

  <script src="vendor/cropper.min.js"></script>
    <script src="vendor/storezip.js"></script>
  <script src="app.js?v=20260828"></script>
</body>
</html>
